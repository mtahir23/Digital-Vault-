<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Digital Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="authentication.css">
</head>
<body>

    <header class="vault-header">
        <div class="header-left">
        <img src="../logo.jpeg" alt="Logo" class="header-logo-img">
        <h1 class="logo-text">Digital <span>Vault</span></h1>
    </div>
        <div class="header-right">
            <a href="login.html" class="btn-top-nav">Return to Login</a>
        </div>
    </header>

    <main class="forgot-wrapper">
        <div class="forgot-card">
            <h2>Forgot Password?</h2>
            <p class="intro">Enter your email address and we'll send you a link to reset your password.</p>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <button type="submit" class="btn-send">Send Reset Link</button>
            </form>

            <div class="links">
                <p>Remembered your password? <a href="login.html">Login</a></p>
            </div>
        </div>
    </main>

    <footer class="vault-footer">
        <p>&copy; 2026 Digital After-Death Data Vault. All Rights Reserved.</p>
    </footer>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e){
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert("Reset link sent to: " + email + " ✅ Check your inbox!");
        });
    </script>

</body>
</html>
