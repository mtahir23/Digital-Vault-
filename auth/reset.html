<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Digital Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="authentication.css">
</head>
<body>

    <header class="vault-header">
        <div class="header-left">
        <img src="../logo.jpeg" alt="Logo" class="header-logo-img">
        <h1 class="logo-text">Digital <span>Vault</span></h1>
    </div>
        <div class="header-right">
            <a href="login.html" class="btn-top-nav">Back to Login</a>
        </div>
    </header>

    <main class="reset-wrapper">
        <div class="reset-card">
            <h2>Reset Password</h2>
            <p class="intro">Secure your account with a new password.</p>
            
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Minimum 8 characters" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat your new password" required>
                </div>

                <button type="submit" class="btn-reset">Update Password</button>
            </form>

            <div class="links">
                <a href="login.html">Login</a> |
                <a href="forgotpass.html">Forgot Password?</a>
            </div>
        </div>
    </main>

    <footer class="vault-footer">
        <p>&copy; 2026 Digital After-Death Data Vault. All Rights Reserved.</p>
    </footer>

    <script>
        const form = document.getElementById('resetForm');
        form.addEventListener('submit', function(e){
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if(newPassword.length < 8) {
                alert("Password must be at least 8 characters long! ❌");
                return;
            }

            if(newPassword !== confirmPassword){
                alert("Passwords do not match! ❌");
                return;
            }

            alert("Password reset successful! ✅ Redirecting to login...");
            // window.location.href = "login.html";
        });
    </script>

</body>
</html>
