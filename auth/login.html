<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Vault - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="authentication.css">
   
</head>
<body>
    <header class="vault-header">
        <div class="header-left">
        <img src="../logo.jpeg" alt="Logo" class="header-logo-img">
        <h1 class="logo-text">Digital <span>Vault</span></h1>
    </div>
        <div class="header-right">
            <a href="register.html" class="btn-register-top">Create Account</a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="intro">Access your secure digital legacy vault.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. name@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Secure Login</button>
            </form>

            <div class="login-links">
                <a href="forgotpass.html">Forgot Password?</a>
                <p style="margin-top: 15px;">Don't have an account? <a href="register.html">Register</a></p>
            </div>
        </div>
    </main>

    <footer class="vault-footer">
        <p>&copy; 2026 Digital After-Death Data Vault. All Rights Reserved.</p>
    </footer>

    <script>
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(email === "" || password === "") {
                alert("Please fill all fields!");
                return;
            }

            alert("Login successful ✅ Redirecting...");
            // window.location.href = "dashboard.php";
        });
    </script>

</body>
</html>
